<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />

    <!-- Brand mark. A transparent PNG, square, with the mark centred. -->
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable summary" />

    <!--
      Per-route head: title, description, robots, canonical, Open Graph,
      Twitter card and JSON-LD. scripts/prerender.mjs replaces everything
      between these markers for each page, from src/lib/seo.ts. The default
      below is the home page's essentials, so the dev server still has a
      title; it deliberately carries no canonical or og:url.
    -->
    <!--head:start-->
    <title>Placeholderworks | Applied AI engineering & implementation</title>
    <meta
      name="description"
      content="Placeholderworks builds and deploys AI systems that solve real business problems: calling agents, WhatsApp chatbots, apps inside ChatGPT, workflow automation, evals and QA."
    />
    <!--head:end-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
